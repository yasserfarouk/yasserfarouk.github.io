<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" fill="#eef4fa"/>
  <!-- interaction arc -->
  <path d="M120 90 Q200 40 280 90" fill="none" stroke="#1f6fb4" stroke-width="3" stroke-dasharray="6 6"/>
  <circle cx="120" cy="90" r="4" fill="#1f6fb4"/>
  <circle cx="280" cy="90" r="4" fill="#1f6fb4"/>

  <!-- human figure (left) -->
  <g fill="#2b2b2b">
    <circle cx="120" cy="130" r="18"/>
    <rect x="106" y="150" width="28" height="55" rx="10"/>
    <rect x="90" y="158" width="14" height="45" rx="6" transform="rotate(-18 90 158)"/>
    <rect x="136" y="158" width="14" height="45" rx="6" transform="rotate(18 150 158)"/>
    <rect x="100" y="205" width="14" height="45" rx="6"/>
    <rect x="126" y="205" width="14" height="45" rx="6"/>
  </g>

  <!-- robot figure (right) -->
  <g fill="#1f6fb4">
    <rect x="260" y="108" width="40" height="34" rx="8"/>
    <circle cx="271" cy="123" r="4" fill="#eef4fa"/>
    <circle cx="289" cy="123" r="4" fill="#eef4fa"/>
    <rect x="277" y="96" width="6" height="14" rx="2"/>
    <circle cx="280" cy="94" r="5"/>
    <rect x="255" y="146" width="50" height="55" rx="12"/>
    <rect x="238" y="152" width="14" height="42" rx="6" transform="rotate(15 238 152)"/>
    <rect x="308" y="152" width="14" height="42" rx="6" transform="rotate(-15 308 152)"/>
    <rect x="260" y="201" width="14" height="42" rx="6"/>
    <rect x="286" y="201" width="14" height="42" rx="6"/>
  </g>

  <text x="200" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f6fb4" font-weight="600">Human-Robot Interaction</text>
</svg>
