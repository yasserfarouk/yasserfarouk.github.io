<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <rect width="400" height="260" fill="#eef4fa"/>

  <!-- speech bubble with waveform -->
  <g>
    <rect x="40" y="60" width="150" height="90" rx="16" fill="#ffffff" stroke="#1f6fb4" stroke-width="3"/>
    <path d="M55 55 L70 60 L45 75 Z" fill="#ffffff" stroke="#1f6fb4" stroke-width="3"/>
    <polyline points="55,105 70,90 85,120 100,80 115,130 130,95 145,110 160,100 175,105"
      fill="none" stroke="#1f6fb4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- arrow -->
  <path d="M200 105 L245 105" stroke="#2b2b2b" stroke-width="3" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#2b2b2b"/>
    </marker>
  </defs>

  <!-- neural network -->
  <g stroke="#1f6fb4" stroke-width="1.5">
    <line x1="270" y1="60" x2="320" y2="80"/>
    <line x1="270" y1="90" x2="320" y2="80"/>
    <line x1="270" y1="90" x2="320" y2="110"/>
    <line x1="270" y1="120" x2="320" y2="80"/>
    <line x1="270" y1="120" x2="320" y2="110"/>
    <line x1="270" y1="150" x2="320" y2="110"/>
    <line x1="270" y1="150" x2="320" y2="140"/>
    <line x1="320" y1="80" x2="360" y2="95"/>
    <line x1="320" y1="110" x2="360" y2="95"/>
    <line x1="320" y1="110" x2="360" y2="125"/>
    <line x1="320" y1="140" x2="360" y2="125"/>
  </g>
  <g fill="#1f6fb4">
    <circle cx="270" cy="60" r="6"/>
    <circle cx="270" cy="90" r="6"/>
    <circle cx="270" cy="120" r="6"/>
    <circle cx="270" cy="150" r="6"/>
    <circle cx="320" cy="80" r="6"/>
    <circle cx="320" cy="110" r="6"/>
    <circle cx="320" cy="140" r="6"/>
    <circle cx="360" cy="95" r="6"/>
    <circle cx="360" cy="125" r="6"/>
  </g>

  <text x="200" y="30" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1f6fb4" font-weight="600">Speech, Signal &amp; Deep Learning</text>
</svg>
